server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: send unknown routes to index.html so client-side routing works
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite outputs content-hashed files to /assets, so they can be cached long-term
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
